<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marvel Universe Quiz</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <script src="./assets/js/global.js" defer></script>
  <script src="./assets/js/profile.js" defer></script>
  

  <body class="app app--profile">
    <header class="app-header">
      <img
        src="./assets/Marvel_Logo.png"
        alt="Marvel Logo"
        class="app-header__logo"
      />
      <h1 class="app-header__title">Universe Quiz</h1>
    </header>

    <main class="app-main-profile">
      <section class="profile" aria-labelledby="profile__title">
        <h2 id="profile__title" class="visually-hidden">Profile</h2>

        <header class="profile__head">
          <div class="profile__avatar" aria-hidden="true"></div>
          <h3 class="profile__name" data-js="name-display">Max Mustermann</h3>
        </header>

        <form class="profile-form" data-js="profile-form">
          <fieldset class="profile__about">
                <legend class="profile__section-title">About me</legend>

                <label class="form__row">
                    <span>Full name</span>
                    <input
                        type="text"
                        name="fullName"
                        data-js="name-input"
                        placeholder="Your name"
                        required
                    />
                    </label>

                    <div class="form__row form__row--grid">
                    <label>
                            <span>Age</span>
                            <input
                            type="number"
                            min="0"
                            max="120"
                            step="1"
                            name="age"
                            data-js="age-input"
                            placeholder="e.g. 28"
                            />
                    </label>

                    <label>
                            <span>Birth year</span>
                            <input
                            type="number"
                            min="1900"
                            max="2100"
                            step="1"
                            name="birthYear"
                            data-js="year-input"
                            placeholder="e.g. 1997"
                            />
                    </label>
                    </div>

                    <label class="form__row">
                    <span>Favorite Marvel character</span>
                    <select
                        name="favorite"
                        data-js="favorite-select"
                        required
                    ></select>
                </label>
          </fieldset>

          <ul class="profile__stats" aria-label="Stats">
            <li class="stat">
              <span class="stat__label">Questions</span
              ><strong class="stat__number">12</strong>
            </li>
            <li class="stat">
              <span class="stat__label">Bookmarks</span
              ><strong class="stat__number">4</strong>
            </li>
          </ul>

          <section class="profile__settings">
            <h4 class="profile__section-title">Settings</h4>
            <label class="switch">
                <input type="checkbox" data-js="dark-toggle" />
                <span class="switch__ui"></span>
                <span class="switch__label">Dark Mode</span>
            </label>
          </section>

          <div class="form__actions">
            <button class="button" type="submit">Save profile</button>
            <button
              class="button button--ghost"
              type="reset"
              data-js="reset-btn"
            >
              Reset
            </button>
          </div>
        </form>
      </section>
    </main>

    <footer>
      <nav class="app-nav">
        <a class="app-nav__link" href="index.html">
          <img src="./assets/icons/Home.svg" alt="Home" class="app-nav__icon" />
        </a>
        <a class="app-nav__link" href="bookmarks.html">
          <img
            src="./assets/icons/Bookmark.svg"
            alt="Bookmarks"
            class="app-nav__icon"
          />
        </a>
        <a class="app-nav__link app-nav__link--active" href="profile.html">
          <img
            src="./assets/icons/user.svg"
            alt="Profile"
            class="app-nav__icon"
            aria-current="page"
          />
        </a>
      </nav>
    </footer>
  </body>
</html>
